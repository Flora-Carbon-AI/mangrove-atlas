# Pages are served from the CDN and /api/* route handlers run as functions.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Declared explicitly: sites linked to Git through the API don't get Next.js
# auto-detected, and without the runtime every route returns 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
