name: Bug report
description: Something on the map or in the panel isn't working.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect to see, and what did you see instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Dataset, year and place
      placeholder: "ESA CCI Land Cover, 2005, Sundarbans"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the map
        2. Select …
        3. Click …
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Chrome 140 on Windows 11 / Safari on iPhone 15"
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot or console errors
      description: Drag an image here, or paste errors from the browser console.
