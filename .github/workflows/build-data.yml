name: Build mangrove tiles

# Rebuilds the Global Mangrove Watch tiles from the official Zenodo release and
# publishes them on GitHub Pages (https://flora-carbon-ai.github.io/mangrove-atlas/),
# where the app reads them. No API keys or cloud accounts involved.
#
# - Branch pushes that change the pipeline: build only, to test the change.
# - Merges to main that change the pipeline, or a manual run: build and publish.

on:
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - ".github/workflows/build-data.yml"

permissions:
  contents: read

concurrency:
  group: build-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GMW v4.1 tiles
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ZENODO: https://zenodo.org/records/21346457/files
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Download GMW v4.1.12 from Zenodo
        run: |
          mkdir -p work/union work/stack && cd work
          curl -fsSL --retry 5 -o union.tar.gz "$ZENODO/gmw_mng_ext_v4112_union.tar.gz?download=1"
          curl -fsSL --retry 5 -o stack.tar.gz "$ZENODO/gmw_mng_ext_v4112_stack.tar.gz?download=1"
          ls -la
          tar -xzf union.tar.gz -C union --warning=no-unknown-keyword
          tar -xzf stack.tar.gz -C stack --warning=no-unknown-keyword
          rm union.tar.gz stack.tar.gz
          echo "union: $(find union -name '*.tif' ! -name '._*' | wc -l) tiles, stack: $(find stack -name '*.tif' ! -name '._*' | wc -l) tiles"
          df -h /

      - name: Build tiles
        run: python pipeline/build_tiles.py --stack work/stack --union work/union --out gmw-v4112.pmtiles --workers 4

      - name: Export tile folder for GitHub Pages
        run: |
          mkdir -p site
          cp pipeline/site/index.html site/
          touch site/.nojekyll
          python pipeline/export_dir.py --pmtiles gmw-v4112.pmtiles --out site/gmw-v4112
          du -sh site

      - name: Keep the single-file archive
        uses: actions/upload-artifact@v4
        with:
          name: gmw-v4112-pmtiles
          path: gmw-v4112.pmtiles
          retention-days: 30
          compression-level: 0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
